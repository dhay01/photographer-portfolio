name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.ghaith-art.com

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.ghaith-art.com

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host
        run: mkdir -p ~/.ssh && ssh-keyscan -H 5.75.207.198 >> ~/.ssh/known_hosts

      - name: Rsync dist
        run: |
          rsync -az --delete \
            --exclude '/alraghad.com.iq/' \
            --exclude '/muhanadkadim.com/' \
            --exclude '/storage.alraghad.com.iq/' \
            --exclude '/depth-of-field/' \
            --exclude '/.well-known/' \
            dist/ ghaith@5.75.207.198:/home/ghaith/public_html/

      - name: Purge nginx cache
        run: ssh root@5.75.207.198 purge-nginx
